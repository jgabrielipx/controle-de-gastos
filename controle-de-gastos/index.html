<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="tag">ORGANIZAÇÃO FINANCEIRA</p>
      <h1>Controle de Gastos</h1>
      <p class="subtitle">Registre suas despesas e acompanhe para onde vai seu dinheiro.</p>
    </header>

    <section class="summary">
      <article class="card total">
        <span>Total de gastos</span>
        <strong id="total">R$ 0,00</strong>
      </article>
      <article class="card">
        <span>Quantidade de despesas</span>
        <strong id="count">0</strong>
      </article>
    </section>

    <section class="panel">
      <h2>Adicionar despesa</h2>
      <form id="expense-form">
        <label for="description">Descrição</label>
        <input id="description" type="text" placeholder="Ex.: Almoço" required maxlength="60">

        <div class="form-row">
          <div>
            <label for="amount">Valor (R$)</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0,00" required>
          </div>
          <div>
            <label for="category">Categoria</label>
            <select id="category">
              <option>Alimentação</option>
              <option>Transporte</option>
              <option>Moradia</option>
              <option>Estudos</option>
              <option>Lazer</option>
              <option>Saúde</option>
              <option>Outros</option>
            </select>
          </div>
        </div>

        <label for="date">Data</label>
        <input id="date" type="date" required>
        <button type="submit">Adicionar despesa</button>
      </form>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2>Minhas despesas</h2>
        <button id="clear-button" class="secondary" type="button">Limpar tudo</button>
      </div>
      <p id="empty-message" class="empty">Nenhuma despesa cadastrada ainda.</p>
      <ul id="expense-list"></ul>
    </section>

    <footer>Seus dados ficam salvos neste navegador.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
